# ~/dotfiles/.tmux.conf

# === プレフィックスキーの設定 ===
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === セッション操作（Ctrl直接） ===
bind -n C-n command-prompt -p "New session name:" "new-session -s '%%'"  # Ctrl+n: 新セッション
bind -n C-s choose-tree -Zs                                              # Ctrl+s: セッション一覧
bind -n C-j switch-client -p                                             # Ctrl+j: 前のセッション
bind -n C-k switch-client -n                                             # Ctrl+k: 次のセッション

# === タブ操作（Ctrl直接） ===
bind -n C-t new-window -c "#{pane_current_path}"  # Ctrl+t: 新タブ（カレントディレクトリを継承）
bind -n C-h previous-window                        # Ctrl+h: 前のタブ
bind -n C-l next-window                            # Ctrl+l: 次のタブ

# === 画面分割移動（Ctrl+a経由） ===
bind h select-pane -L          # Ctrl+a → h: 左のペイン
bind j select-pane -D          # Ctrl+a → j: 下のペイン
bind k select-pane -U          # Ctrl+a → k: 上のペイン
bind l select-pane -R          # Ctrl+a → l: 右のペイン

# === その他のCtrl+a操作 ===
bind / split-window -h -c "#{pane_current_path}"  # Ctrl+a → /: 縦分割（カレントディレクトリを継承）
bind - split-window -v -c "#{pane_current_path}"  # Ctrl+a → -: 横分割（カレントディレクトリを継承）
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # Ctrl+a → r: 設定リロード

# === 便利設定 ===
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
setw -g mode-keys vi
set -g status-left-length 20

# === [改善] endaamanから採用: 基本機能の強化 ===
# 参考: endaaman/dotfiles/tmux.conf

# [改善] 履歴を大幅に増やす (L13)
# 効果: スクロールバックの履歴が実質無制限になり、長いログも確認可能
set -g history-limit 999999999

# [改善] クリップボード統合を有効化 (L17)
# 効果: tmuxとシステムクリップボードの自動連携
set -g set-clipboard on

# [改善] セッションが空になっても切断しない (L16)
# 効果: 最後のウィンドウを閉じても次のセッションに自動切り替え
set -g detach-on-destroy off

# [改善] focus-eventsを有効化 (L41)
# 効果: Vim/Neovimとの統合が改善され、フォーカスの出入りを検知可能
set -g focus-events on

# [改善] ステータスバーの更新間隔 (L11)
set -g status-interval 60

# === [改善] カラー設定の強化 ===
# [改善] 256色＋RGB対応のターミナル設定 (L33-34)
# 効果: より正確な色表示とTrue Color対応
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# === [改善] ステータスバーの視覚的改善 ===
# [改善] SSH接続時はステータスバーを緑色に (L57-61)
# 効果: ローカル/リモート環境の視覚的な区別が容易に
%if #{SSH_CONNECTION}
  set -g status-style 'bg=green,fg=black'
  set -g status-left '#[fg=black,bg=yellow] SSH #[bg=default,fg=blue] #S | '
%else
  set -g status-style 'bg=black,fg=white'
  set -g status-left '#[fg=black,bg=white] LOCAL #[bg=default,fg=blue] #S | '
%endif

set -g status-position bottom
set -g status-justify left

# [改善] コピーモード中はステータスバーをオレンジ色に (L49)
# 効果: コピーモード中であることが一目で分かる
set-hook -g pane-mode-changed 'if -F "#{m/r:(copy|view)-mode,#{pane_mode}}" "set status-style bg=colour208,fg=black" "set -u status-style"'

# [改善] コピーモードの選択範囲を見やすく (L172)
set -g mode-style 'bg=yellow,fg=black'

# === メッセージスタイル ===
set -g message-style 'fg=yellow,bg=black'

# === デフォルトシェルをzshに設定 ===
set-option -g default-shell /usr/bin/zsh
